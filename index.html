<style>
:root{--bg:#07060c;--panel:#120b17;--bot:#1b1024;--me:#e0245e;--me2:#8b1538;--volt:#5cc8ff;--gold:#f5c26b;--ink:#f6eef3;--dim:#a590a8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#2a0f2e 0%,var(--bg) 60%);color:var(--ink);font-family:Georgia,"Noto Serif",serif;display:flex;flex-direction:column;max-width:640px;margin:0 auto;position:relative;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 30%,rgba(92,200,255,.35),transparent 55%);opacity:0;z-index:0}
body.flash::before{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:.9}30%{opacity:.15}45%{opacity:.6}100%{opacity:0}}
header,#log,.chips,form{position:relative;z-index:1}
header{padding:14px 18px;background:linear-gradient(180deg,#1a0d22,var(--panel));display:flex;align-items:center;gap:12px;border-bottom:1px solid #3a1a3f;box-shadow:0 1px 18px rgba(92,200,255,.12)}
.av{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#7ad6ff,#2a6fd6);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 0 14px rgba(92,200,255,.6);cursor:pointer}
header h1{font-size:19px;font-weight:700;letter-spacing:.5px}
header h1 span{color:var(--volt)}
header p{font-size:13px;color:var(--dim);font-style:italic}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:82%;padding:10px 14px;border-radius:16px;line-height:1.45;font-size:16px;white-space:pre-wrap;word-wrap:break-word}
.bot{background:var(--bot);border:1px solid rgba(92,200,255,.35);box-shadow:0 0 12px rgba(92,200,255,.08);align-self:flex-start;border-bottom-left-radius:4px}
.me{background:linear-gradient(135deg,var(--me),var(--me2));color:#fff;align-self:flex-end;border-bottom-right-radius:4px;box-shadow:0 2px 14px rgba(224,36,94,.3)}
.typing{opacity:.7;letter-spacing:3px;animation:blink 1s infinite}@keyframes blink{50%{opacity:.3}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 0}
.chips button{flex:none;background:transparent;color:var(--gold);border:1px solid rgba(245,194,107,.5);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chips button:active{background:var(--bot)}
form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
input{flex:1;min-width:0;background:var(--panel);color:var(--ink);border:1px solid #3a1a3f;border-radius:999px;padding:12px 16px;font:inherit;font-size:16px}
input::placeholder{color:var(--dim)}
input:focus-visible,button:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
form button{background:linear-gradient(135deg,var(--me),var(--me2));color:#fff;border:0;border-radius:999px;padding:0 20px;font:inherit;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.m{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:0}}}
@media (prefers-reduced-motion:reduce){body.flash::before{animation:none}}
</style>
</head>

function reply(t){
  const s=t.toLowerCase().trim().replace(/(.)\1{2,}/g,"$1");
  let m;
  if((m=s.match(/(?:mera naam|my name is|main hoon|i am|i'm)\s+([a-z\u0900-\u097f]+)/i))){
    user=m[1][0].toUpperCase()+m[1].slice(1);
    try{localStorage.setItem("billadon_user",user)}catch(e){}
    return "Mast naam hai, "+user+"! Ab se tujhe yahi bulaunga. 😎";
  }
  if(riddle){
    const r=riddle;
    if(/(pata nahi|nahi pata|batao|bata do|answer|jawab|give up|hint)/.test(s)){riddle=null;return "Jawab tha: "+r.r+" 😏 Ek aur chahiye toh 'paheli' bol.";}
    if(r.a.some(k=>s.includes(k))){riddle=null;return "Waah "+nm()+"! Sahi jawab! 🎉 "+r.r+" Tu toh sach mein tez hai. 😈";}
    riddle=null;return "Galat! 😜 Sahi jawab: "+r.r+" Phir try karega? 'paheli' bol.";
  }
  const expr=s.replace(/^(calculate|calc|hisab|solve)\s*/,"").replace(/x/g,"*").replace(/÷/g,"/");
  if(/^[0-9+\-*/().%\s]+$/.test(expr)&&/\d/.test(expr)&&/[+\-*/%]/.test(expr)){
    try{const r=Function('"use strict";return ('+expr+')')();
      if(Number.isFinite(r))return expr+" = "+(Math.round(r*1e6)/1e6)+"\nMaths mein toh Don topper hai! 🤓"}catch(e){}
    return "Yeh hisab gadbad hai bhai, dobara likh.";
  }
  if(/^(aur|ek aur|phir se|again|more|aur sunao|next)\b/.test(s)&&last)return last();
  for(const [re,out] of rules){
    if(re.test(s)){
      const f=typeof out==="function"?out:()=>pick(out);
      last=f;return f();
    }
  }
  last=null;
  if(/\?\s*$/.test(t)||/^(kya|kyun|kaise|kaun|kab|kahan|kitna|why|what|how|when|who)\b/.test(s))
    return pick(["Sawal toh solid hai, "+nm()+"! Par iska pakka jawab mere paas nahi. Mere paas joke, shayari aur paheli hain. 😈","Hmm, sochne wala sawal hai. 🤔 Asli jawab ke liye Google ko pooch, mujhse shayari sun le. 😏"]);
  return pick(fallback);
}

function add(text,who){
  const d=document.createElement("div");
  d.className="m "+who;d.textContent=text;
  log.appendChild(d);log.scrollTop=log.scrollHeight;
  if(who==="bot")zap();
  return d;
}

  setTimeout(()=>{ty.remove();add(out,"bot")},400+Math.min(out.length*12,900)+Math.random()*300);
}
